    <div id="last-update"></div>

    <script>
        (() => {
            const updateDiv = document.getElementById("last-update");
            if (!updateDiv) return;

            const date = new Date(document.lastModified);
            const options = { year: "numeric", month: "long", day: "numeric" };
            const lang = document.documentElement.lang || navigator.language || 'fr-CA';
            const dateStr = date.toLocaleDateString(lang, options);

            updateDiv.textContent = (lang.slice(0, 2) === "en" ? "Last updated: " : "Dernière mise à jour : ") + dateStr;
        })();
    </script>
